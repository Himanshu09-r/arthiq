<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1728"><title>Demo Sign in · ARTHIQ</title>
<style>
:root{color-scheme:dark;--bg:#0b1728;--card:#12243a;--line:#263c55;--text:#f4f7fb;--muted:#9fb0c4;--accent:#22c58b}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at 15% 10%,#17405a 0,transparent 35%),linear-gradient(145deg,#081321,#10243a);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text)}
.card{width:min(100%,420px);padding:36px;border:1px solid var(--line);border-radius:24px;background:#102239ed;box-shadow:0 24px 70px #0006}.brand{font-size:32px;font-weight:900;letter-spacing:-1.5px}.tag{margin-top:7px;color:var(--muted);font-size:14px}.rule{height:1px;background:var(--line);margin:27px 0}.heading{font-size:21px;font-weight:750;margin:0 0 7px}.sub{font-size:13px;color:var(--muted);margin:0 0 24px}label{display:block;font-size:12px;font-weight:650;color:#cbd7e5;margin:17px 0 8px}input{width:100%;height:48px;border-radius:11px;border:1px solid #38516d;background:#0a192a;color:white;padding:0 14px;font-size:15px;outline:none}input:focus{border-color:var(--accent);box-shadow:0 0 0 3px #22c58b22}button{width:100%;height:49px;margin-top:24px;border:0;border-radius:11px;background:var(--accent);color:#062319;font-weight:800;font-size:14px;cursor:pointer}button:disabled{opacity:.65;cursor:wait}#message{min-height:20px;margin-top:15px;color:#ffb4a9;font-size:13px}.foot{margin-top:22px;text-align:center;color:#8094aa;font-size:11px}
</style></head>
<body><main class="card">
  <div class="brand">ARTHIQ</div><div class="tag">Your shop. In control.</div><div class="rule"></div>
  <h1 class="heading">Welcome to ARTHIQ</h1><p class="sub">Competition demo access. Enter any username and password to continue.</p>
  <form id="loginForm" autocomplete="on">
    <label for="username">Username</label><input id="username" name="username" autocomplete="username" required maxlength="100" autofocus>
    <label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="256">
    <button id="submitBtn" type="submit">Enter Demo Dashboard</button><div id="message" role="alert"></div>
  </form><div class="foot">Competition Demo Mode · Any non-empty credentials accepted</div>
</main>
<script>
const form=document.getElementById('loginForm'),btn=document.getElementById('submitBtn'),msg=document.getElementById('message');
(async()=>{try{const r=await fetch('/auth/me',{credentials:'same-origin'});if(r.ok)location.replace('/');}catch(_){}})();
form.addEventListener('submit',async e=>{e.preventDefault();btn.disabled=true;btn.textContent='Signing in…';msg.textContent='';try{const r=await fetch('/auth/login',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('username').value.trim(),password:document.getElementById('password').value})});const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.detail||'Could not sign in');location.replace('/');}catch(err){msg.textContent=err.message;btn.disabled=false;btn.textContent='Enter Demo Dashboard';}});
</script></body></html>
